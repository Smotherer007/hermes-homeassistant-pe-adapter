[project]
name = "hermes-pe-adapter"
version = "0.1.0"
description = "ESPHome voice device adapter for Hermes Agent: wake word in, spoken answer out, no local models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Patrick Weppelmann" }]
keywords = ["hermes", "esphome", "voice-assistant", "voice-pe", "mistral", "voxtral", "tts", "stt"]
dependencies = [
    "aioesphomeapi>=42",
    "aiohttp>=3.9",
    "webrtcvad-wheels>=2.0.14",
]

[project.urls]
Homepage = "https://github.com/Smotherer007/hermes-homeassistant-pe-adapter"

[project.scripts]
hermes-pe = "hermes_pe.bridge:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_pe"]
